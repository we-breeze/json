[package]
name = "brz-json"
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/json"
readme = "README.md"
description = "Borrowing JSON deserialization over Breeze segmented readers"

[lib]
name = "brz_json"

[dependencies]
brz-io = { version = "0.0.2", default-features = false }
serde = "1"
serde_json = "1"

[dev-dependencies]
brz-ds = { package = "brz-ds", version = "0.0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "deny"
